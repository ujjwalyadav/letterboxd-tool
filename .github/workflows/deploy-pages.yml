name: Build and deploy My Film Atlas

on:
  push:
    branches: ["main"]
    paths:
      - "data/**"
      - "scripts/**"
      - "assets/**"
      - "*.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore TMDB cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: tmdb-${{ runner.os }}-${{ hashFiles('data/*.csv') }}-${{ github.run_id }}
          restore-keys: |
            tmdb-${{ runner.os }}-${{ hashFiles('data/*.csv') }}-
            tmdb-${{ runner.os }}-

      - name: Build enriched catalog
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TMDB_LANGUAGE: en-US
          TMDB_REGION: DE
          TMDB_CACHE_DAYS: "30"
        run: python scripts/enrich.py

      - name: Assemble static site
        run: |
          mkdir -p dist
          cp index.html statistics.html map.html about.html dist/
          cp -R assets dist/assets
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
