name: Build and deploy My Film Atlas

on:
  push:
    branches: ["main"]
    paths:
      - "data/**"
      - "scripts/**"
      - "assets/**"
      - "*.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This persists BOTH caches between workflow runs:
      #   .cache/tmdb.json
      #   .cache/letterboxd_community.json
      #
      # GitHub Actions caches are immutable, so github.run_id deliberately makes
      # each saved cache unique while restore-keys finds the newest previous one.
      - name: Restore metadata caches
        uses: actions/cache@v4
        with:
          path: .cache
          key: film-atlas-metadata-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            film-atlas-metadata-${{ runner.os }}-
            tmdb-${{ runner.os }}-

      - name: Build enriched catalog
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TMDB_LANGUAGE: en-US
          TMDB_REGION: DE
          TMDB_CACHE_DAYS: "30"

          # Community statistics are reused from
          # .cache/letterboxd_community.json. Only missing/stale titles are
          # requested from Letterboxd.
          LETTERBOXD_SCRAPE_ENABLED: "1"
          LETTERBOXD_COMMUNITY_REFRESH_DAYS: "90"
          LETTERBOXD_WORKERS: "8"
          LETTERBOXD_REQUEST_DELAY: "0.15"
        run: python scripts/enrich.py

      - name: Assemble static site
        run: |
          mkdir -p dist
          cp index.html statistics.html map.html about.html review.html dist/
          cp -R assets dist/assets
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
